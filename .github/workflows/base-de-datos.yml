# Pruebas y despliegue de la base de datos
#
#   rama develop → proyecto Supabase de PRUEBAS
#   rama main    → proyecto Supabase de PRODUCCIÓN (pide aprobación manual)
#
# Nada se despliega si las pruebas fallan.
#
# Configuración necesaria en GitHub (Settings → Secrets and variables → Actions):
#   Secreto del repositorio:   SUPABASE_ACCESS_TOKEN
#   Entorno "pruebas":         SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
#   Entorno "produccion":      SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
#                              (+ "Required reviewers" para aprobar cada despliegue)
#   Opcional, en cada entorno: RESEND_API_KEY (para el informe semanal por correo)
#                              y la variable PANEL_URL (enlace del panel en el correo)

name: Base de datos

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  pruebas:
    name: Pruebas del esquema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  desplegar:
    name: Aplicar migraciones (${{ github.ref_name == 'main' && 'produccion' || 'pruebas' }})
    needs: pruebas
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'produccion' || 'pruebas' }}
    concurrency:
      group: migraciones-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0   # versión fija: reproducible y sin consultar "latest"
      - name: Verificar configuración
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          faltan=0
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && { echo "::error::Falta el secreto del repositorio SUPABASE_ACCESS_TOKEN"; faltan=1; }
          [ -z "$PROJECT_REF" ]           && { echo "::error::Falta SUPABASE_PROJECT_REF en el entorno ${{ github.ref_name == 'main' && 'produccion' || 'pruebas' }}"; faltan=1; }
          [ -z "$SUPABASE_DB_PASSWORD" ]  && { echo "::error::Falta SUPABASE_DB_PASSWORD en el entorno ${{ github.ref_name == 'main' && 'produccion' || 'pruebas' }}"; faltan=1; }
          if [ -n "$PROJECT_REF" ] && ! [[ "$PROJECT_REF" =~ ^[a-z]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_REF no tiene el formato esperado (20 letras minúsculas, sin URL ni espacios). Tiene ${#PROJECT_REF} caracteres."
            faltan=1
          fi
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && ! [[ "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN no empieza por sbp_. Debe ser un Access Token de cuenta (supabase.com/dashboard/account/tokens), no la anon key ni la service_role key."
            faltan=1
          fi
          exit $faltan
      - name: Conectar con el proyecto
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if ! supabase link --project-ref "$PROJECT_REF" > link.log 2>&1; then
            mensaje=$(grep -v '^\s*$' link.log | tail -5 | tr '\n' ' ' | cut -c1-600)
            echo "::error::supabase link falló: $mensaje"
            exit 1
          fi
      - name: Migraciones pendientes
        run: supabase migration list
      - name: Aplicar
        run: supabase db push
      - name: Desplegar funciones del servidor
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for f in supabase/functions/*/; do
            nombre=$(basename "$f")
            echo "Desplegando $nombre"
            # "informe" la llama la base de datos (pg_cron) con su propia clave, sin sesión
            if [ "$nombre" = "informe" ]; then extra="--no-verify-jwt"; else extra=""; fi
            supabase functions deploy "$nombre" --project-ref "$PROJECT_REF" --use-api $extra
          done
      - name: Configurar el informe semanal
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PANEL_URL: ${{ vars.PANEL_URL }}
        run: |
          # Dirección de las funciones para la tarea programada (pg_cron)
          consulta="insert into app.ajustes values ('url_funciones', 'https://$PROJECT_REF.supabase.co/functions/v1') on conflict (clave) do update set valor = excluded.valor"
          codigo=$(curl -sS -o respuesta.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$consulta" '{query: $q}')")
          if [ "$codigo" -ge 300 ]; then echo "::warning::No se pudo guardar la dirección de funciones ($codigo): $(head -c 300 respuesta.json)"; fi
          if [ -n "$RESEND_API_KEY" ]; then
            args="RESEND_API_KEY=$RESEND_API_KEY"
            [ -n "$PANEL_URL" ] && args="$args PANEL_URL=$PANEL_URL"
            supabase secrets set $args --project-ref "$PROJECT_REF" > /dev/null
            echo "Clave de envío configurada"
          else
            echo "::notice::Sin RESEND_API_KEY en este entorno: el informe semanal no se enviará hasta agregarla."
          fi
