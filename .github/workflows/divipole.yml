# Descarga el Divipole oficial de la Registraduría y guarda las tablas
# extraídas en esta misma rama (datos/divipole/), para revisarlas y
# convertirlas en una migración. No toca develop, main ni Supabase.

name: Divipole

on:
  push:
    branches: ['datos/divipole-*']
    paths: ['.github/workflows/divipole.yml', 'scripts/datos/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pdfplumber==0.11.4

      - name: Descargar PDF oficial
        run: |
          RUTA="IMG/pdf/Divipole_definitiva_%20Elecciones_Congreso_2026_GEO_CITREP_Exterior_L_V_v5.pdf"
          for url in "https://registraduria.gov.co/$RUTA" "https://www.registraduria.gov.co/$RUTA" "http://www.registraduria.gov.co/$RUTA"; do
            codigo=$(curl -sS -L --retry 2 --retry-delay 5 --max-time 600 -o divipole.pdf -w '%{http_code}' \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
              -H "Accept: application/pdf,text/html;q=0.9,*/*;q=0.8" -H "Accept-Language: es-CO,es;q=0.9" \
              -e "https://www.registraduria.gov.co/" "$url" || echo "curl-error")
            tipo=$(file -b divipole.pdf 2>/dev/null | cut -c1-60)
            echo "::warning::$url -> HTTP $codigo, $(stat -c %s divipole.pdf 2>/dev/null || echo 0) bytes, $tipo"
            if head -c 5 divipole.pdf 2>/dev/null | grep -q '%PDF'; then
              echo "DIVIPOLE_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::No se pudo descargar el PDF desde ninguna variante"
          exit 1

      - name: Extraer tablas
        run: python scripts/datos/extraer_divipole.py divipole.pdf datos/divipole

      - name: Guardar resultado en la rama
        run: |
          {
            echo "fuente: $DIVIPOLE_URL"
            echo "descargado: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tamaño_bytes: $(stat -c %s divipole.pdf)"
          } > datos/divipole/FUENTE.txt
          gzip -9 -k -f datos/divipole/divipole_crudo.csv
          rm datos/divipole/divipole_crudo.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/divipole
          git commit -m "Divipole Congreso 2026: tablas extraídas del PDF oficial [skip ci]" || echo "Sin cambios"
          git push
