<!-- Asunto: Crea una contraseña nueva para NexoT -->
<div style="background:#f5f7fb;padding:32px 12px;font-family:Arial,Helvetica,sans-serif;color:#1a1a2e">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e6e8f0">
    <div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);background-color:#6f63c6;padding:28px 24px;color:#ffffff">
      <div style="font-size:22px;font-weight:800">NexoT</div>
      <div style="font-size:14px;opacity:.9;margin-top:4px">Gestión de la campaña</div>
    </div>
    <div style="padding:28px 24px">
      <h1 style="font-size:20px;margin:0 0 12px">Crea una contraseña nueva</h1>
      <p style="font-size:15px;line-height:1.5;margin:0 0 20px;color:#4b5068">
        Recibimos una solicitud para entrar a NexoT con este correo. Usa el botón para poner una contraseña nueva:
      </p>
      <p style="text-align:center;margin:0 0 24px">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#667eea;color:#ffffff;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:12px">Poner contraseña nueva</a>
      </p>
      <p style="font-size:13px;line-height:1.5;color:#6b7085;margin:0">
        El enlace sirve una sola vez y vence en 1 hora. Si no lo pediste, ignora este correo: tu contraseña no cambia.
      </p>
    </div>
  </div>
</div>
